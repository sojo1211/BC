<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>LOCAL LOOP 대시보드 (스타터)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 지도 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- React + 차트 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root { --ink:#1F4E5F; --accent:#2E6E8E; --bg:#F7FAFB; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif; background:var(--bg); color:#222; }
  header { background:var(--ink); color:#fff; padding:20px 28px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.8; }
  .grid { display:grid; grid-template-columns: 1.1fr 1fr; gap:20px; padding:24px; max-width:1300px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:18px 20px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--ink); }
  .card.full { grid-column: 1 / -1; }
  #map { height:380px; border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; }
  th { color:#888; font-weight:600; }
  .note { font-size:12px; color:#999; margin-top:10px; }
  .badge { display:inline-block; background:#EEF4F7; color:var(--accent); padding:2px 8px; border-radius:6px; font-size:12px; margin-left:8px; }
</style>
</head>
<body>
<header>
  <h1>LOCAL LOOP · 데이터 대시보드 (개발용 스타터)</h1>
  <p>data_pipeline.py 결과(metrics.json)를 그대로 시각화합니다. BC카드 데이터가 들어오면 우측 하단 카드가 자동으로 채워집니다.</p>
</header>
<div id="root"></div>

<script type="text/babel">
const { BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Cell } = Recharts;

function App() {
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState(null);

  React.useEffect(() => {
    fetch("../output/metrics.json")
      .then(r => { if (!r.ok) throw new Error("metrics.json을 못 찾았습니다. data_pipeline.py를 먼저 실행하세요."); return r.json(); })
      .then(setData)
      .catch(e => setError(e.message));
  }, []);

  React.useEffect(() => {
    if (!data) return;
    const map = L.map("map").setView([37.5130, 126.9420], 14); // 노량진역
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const facility = data["노량진_2km_반경_시설"];
    L.circle([facility.center.lat, facility.center.lon], {
      radius: facility.radius_km * 1000, color: "#2E6E8E", fillOpacity: 0.05,
    }).addTo(map);
    L.marker([facility.center.lat, facility.center.lon]).addTo(map).bindPopup("노량진역");

    facility.하천이용시설.forEach(f => {
      L.circleMarker([f.lat, f.lon], { radius: 3, color: "#4FA3C4" }).addTo(map).bindPopup(f.name);
    });
    facility.공원.forEach(f => {
      L.circleMarker([f.lat, f.lon], { radius: 5, color: "#2E8B57" }).addTo(map).bindPopup(f.name);
    });

    return () => map.remove();
  }, [data]);

  if (error) return <div style={{padding:24, color:"crimson"}}>{error}</div>;
  if (!data) return <div style={{padding:24}}>불러오는 중...</div>;

  const flowTop10 = data["자치구별_유동인구_순위"].slice(0, 10);
  const storeTop10 = data["자치구별_개인매장_비율"].slice(0, 10);
  const transferTop10 = data["환승역_TOP15"].slice(0, 10);

  return (
    <div className="grid">
      <div className="card">
        <h2>자치구별 유동인구 TOP10 <span className="badge">{data["생성기준_최신분기"]}</span></h2>
        <ResponsiveContainer width="100%" height={300}>
          <BarChart data={flowTop10} layout="vertical" margin={{ left: 20 }}>
            <CartesianGrid strokeDasharray="3 3" horizontal={false} />
            <XAxis type="number" tickFormatter={(v)=> (v/1e8).toFixed(1)+"억"} />
            <YAxis type="category" dataKey="자치구" width={60} />
            <Tooltip formatter={(v)=> v.toLocaleString()+"명"} />
            <Bar dataKey="유동인구" fill="#2E6E8E" radius={[0,4,4,0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div className="card">
        <h2>자치구별 개인매장(로컬) 비율 TOP10</h2>
        <ResponsiveContainer width="100%" height={300}>
          <BarChart data={storeTop10} layout="vertical" margin={{ left: 20 }}>
            <CartesianGrid strokeDasharray="3 3" horizontal={false} />
            <XAxis type="number" domain={[0,1]} tickFormatter={(v)=> (v*100).toFixed(0)+"%"} />
            <YAxis type="category" dataKey="자치구" width={60} />
            <Tooltip formatter={(v)=> (v*100).toFixed(1)+"%"} />
            <Bar dataKey="개인매장_비율" fill="#2E8B57" radius={[0,4,4,0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div className="card full">
        <h2>동작구(노량진역 반경 2km) 러닝 코스 proxy — 지도</h2>
        <div id="map"></div>
        <p className="note">파란 점: 하천이용시설({data["노량진_2km_반경_시설"].하천이용시설_개수}개) · 초록 점: 공원({data["노량진_2km_반경_시설"].공원_개수}개)</p>
      </div>

      <div className="card">
        <h2>환승 거점 TOP10 (평일 환승인원)</h2>
        <table>
          <thead><tr><th>역명</th><th>평일</th><th>토요일</th><th>일요일</th></tr></thead>
          <tbody>
            {transferTop10.map((r,i)=>(
              <tr key={i}><td>{r.역명}</td><td>{Math.round(r.평일_환승인원).toLocaleString()}</td><td>{r.토요일.toLocaleString()}</td><td>{r.일요일.toLocaleString()}</td></tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="card">
        <h2>BC카드 소비데이터 연동 자리</h2>
        <p style={{fontSize:13, color:"#888"}}>
          현재: <b>{data["bc카드_소비데이터"]}</b><br/><br/>
          data_pipeline.py 의 <code>load_bc_card_placeholder()</code> 를 실제 파일 경로로 바꾸면,
          이 자리에 "유동인구 대비 전환율" 랭킹 차트를 그대로 추가하면 됩니다.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
